name: SitePivot server data QA

on:
  push:
    branches: [sitepivot-concept]
    paths:
      - 'api/**'
      - 'index.html'
      - 'qa/**'
      - 'package*.json'
      - '.github/workflows/sitepivot-server-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sitepivot-server-data-qa
  cancel-in-progress: true

jobs:
  data-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test NSW address, identity and planning providers server-side
        run: node qa/serverless-smoke.cjs
