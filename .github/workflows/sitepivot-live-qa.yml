name: SitePivot live QA

on:
  push:
    branches: [sitepivot-concept]
    paths:
      - 'index.html'
      - 'commercial-engine.js'
      - 'conversation.js'
      - 'voice.js'
      - 'qa/**'
      - '.github/workflows/sitepivot-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sitepivot-live-qa
  cancel-in-progress: true

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Wait for GitHub Pages deployment
        run: |
          for i in {1..18}; do
            code=$(curl -L -s -o /tmp/sitepivot.html -w "%{http_code}" "https://boggedcake.github.io/ProjectIQ/?qa=${GITHUB_SHA}")
            curl -L -s -o /tmp/sitepivot-engine.js "https://boggedcake.github.io/ProjectIQ/commercial-engine.js?qa=${GITHUB_SHA}"
            curl -L -s -o /tmp/sitepivot-conversation.js "https://boggedcake.github.io/ProjectIQ/conversation.js?qa=${GITHUB_SHA}"
            curl -L -s -o /tmp/sitepivot-voice.js "https://boggedcake.github.io/ProjectIQ/voice.js?qa=${GITHUB_SHA}"
            if [ "$code" = "200" ] && cmp -s index.html /tmp/sitepivot.html && cmp -s commercial-engine.js /tmp/sitepivot-engine.js && cmp -s conversation.js /tmp/sitepivot-conversation.js && cmp -s voice.js /tmp/sitepivot-voice.js; then
              echo "Deployed source matches tested branch head"
              exit 0
            fi
            sleep 10
          done
          echo "Site was not reachable in time"
          exit 1
      - name: Run deployed browser smoke test
        run: node qa/live-smoke.mjs
        env:
          SITEPIVOT_BUILD: ${{ github.sha }}

      - name: Verify repaired founder conversation, voice, duplex and changeover on the deployed site
        run: node qa/founder-repair-browser.cjs
        env:
          SITEPIVOT_URL: https://boggedcake.github.io/ProjectIQ/

      - name: Run full deployed desktop and iPhone founder journeys
        run: node qa/deployed-founder.mjs

      - name: Run deployed unified conversation and voice journeys in Chromium and WebKit
        run: node qa/deployed-conversation.mjs
