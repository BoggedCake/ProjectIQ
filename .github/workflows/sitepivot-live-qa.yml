name: SitePivot live QA

on:
  push:
    branches: [sitepivot-concept]
    paths:
      - 'index.html'
      - 'qa/**'
      - '.github/workflows/sitepivot-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright --no-save
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        run: |
          for i in {1..18}; do
            code=$(curl -L -s -o /tmp/sitepivot.html -w "%{http_code}" "https://boggedcake.github.io/ProjectIQ/?qa=${GITHUB_SHA}")
            if [ "$code" = "200" ] && grep -q "SITEPIVOT-LIVE-DATA-V2" /tmp/sitepivot.html; then
              echo "Site reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Site was not reachable in time"
          exit 1
      - name: Run deployed browser smoke test
        run: node qa/live-smoke.mjs
