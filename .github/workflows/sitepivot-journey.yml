name: SitePivot consumer regression
on:
  push:
    branches: [sitepivot-concept]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/journey.cjs
        env:
          QA_OUTPUT: journey-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-journey-results
          path: journey-results.json
