name: SitePivot consumer regression
on:
  push:
    branches: [sitepivot-concept]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitepivot-consumer-regression
  cancel-in-progress: true
jobs:
  consumer-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          QA_OUTPUT: journey-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-journey-results
          path: journey-results.json
