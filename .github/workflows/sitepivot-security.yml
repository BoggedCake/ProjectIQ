name: SitePivot security preparation
on:
  push:
    branches: [sitepivot-concept]
  pull_request:
    branches: [sitepivot-concept]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:security
      - name: Redacted reachable-history and working-tree scan
        run: python3 scripts/scan-secrets.py
      - run: npm audit --audit-level=moderate
      - name: Verify allowlisted future deployment package (does not publish)
        run: npm run build:founder
